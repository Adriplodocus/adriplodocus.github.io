<!DOCTYPE html>
<html lang="en">
    <head>
        <title data-i18n="cv-title">Adrián DG. CV</title>
        <link rel="icon" href="favicon.ico" type="image/x-icon">

        <!--META-->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Curriculum vitae of Adrián Durán, Unity game developer with shipped mobile and PC titles.">

        <!--Open Graph-->
        <meta property="og:type"        content="website">
        <meta property="og:url"         content="https://adriplodocus.github.io/CV.html">
        <meta property="og:title"       content="CV — Adrián Durán">
        <meta property="og:description" content="Curriculum vitae of Adrián Durán, Unity game developer with shipped mobile and PC titles.">
        <meta property="og:image"       content="https://adriplodocus.github.io/Imgs/Me.png">
        <meta name="twitter:card"       content="summary_large_image">

        <meta name="theme-color" content="#0d0d11">
        <link rel="preload" href="Fonts/Louis.ttf" as="font" type="font/ttf" crossorigin>
        <!--CSS REFS-->
        <link rel="stylesheet" type="text/css" href="Style/style.css">
        <script src="Scripts/localization.js"></script>
    </head>

    <body>
        <!--Top of page-->
        <header id="header"></header>
        <script src="Scripts/header.js"></script>

        <!--Page content-->
        <main class="contentDiv page-fade" style="text-align: center;">
            <div class="cv-actions">
                <a href="Imgs/CV_ENG.pdf" class="btn btn-primary" download data-i18n="download-cv" data-i18n-href="cv-pdf-src">Download CV</a>
            </div>
            <picture>
                <source srcset="Imgs/CV_Eng.webp" type="image/webp" data-i18n-srcset="cv-webp-src">
                <img class="documentImg" id="img_cv" src="Imgs/CV_Eng.png" alt="Curriculum Vitae" data-i18n="cv-img-alt" data-i18n-src="cv-img-src" style="max-height: 85vh;">
            </picture>
        </main>

        <!--Page ending-->
        <footer id="footer"></footer>
        <script src="Scripts/footer.js"></script>
    </body>
</html>
